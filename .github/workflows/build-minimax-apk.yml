name: Build openGym MiniMax-M3 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-minimax-apk.yml'
      - 'scripts/**'
      - 'README.md'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout compatibility build kit
        uses: actions/checkout@v4
      - name: Clone openGym upstream
        run: git clone --depth 1 https://github.com/DuarteSantos8/openGym.git openGym
      - name: Apply MiniMax-M3 compatibility fix
        run: python3 scripts/patch_opengym_minimax.py openGym
      - name: Verify patch without exposing any keys
        run: node scripts/check_minimax.mjs
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK and required packages
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install frontend dependencies
        working-directory: openGym/frontend
        run: npm install --no-audit --no-fund
      - name: Build mobile web assets and Android project
        working-directory: openGym/frontend
        run: npm run build:mobile
      - name: Compile independently installable debug APK
        working-directory: openGym/frontend/android
        run: |
          # An isolated package ID so this new debug signature does not conflict with v1.
          sed -i 's/applicationIdSuffix "\.test"/applicationIdSuffix "\.test.m3v2"/' app/build.gradle
          grep 'applicationIdSuffix "\.test.m3v2"' app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp openGym/frontend/android/app/build/outputs/apk/debug/app-debug.apk dist/openGym-MiniMax-M3-v2-debug.apk
          cd dist
          sha256sum openGym-MiniMax-M3-v2-debug.apk > openGym-MiniMax-M3-v2-debug.apk.sha256
      - name: Upload download-ready APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openGym-MiniMax-M3-v2-APK
          path: dist/*
          retention-days: 30
          if-no-files-found: error
      - name: Publish directly downloadable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "minimax-m3-build-${{ github.run_number }}" dist/openGym-MiniMax-M3-v2-debug.apk dist/openGym-MiniMax-M3-v2-debug.apk.sha256 --repo "${{ github.repository }}" --title "openGym MiniMax-M3 Android test build ${{ github.run_number }}" --notes "Third-party experimental v2 debug build; uses new application ID ch.duartesantos.opengym.test.m3v2 for side-by-side installation. MiniMax-M3 thinking disabled; one retry on interrupted sockets, which may incur a second provider API charge. Not yet validated on physical Android device. Keep original app and backup data."
